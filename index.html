<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agensi Pengembangan Web & UI/UX Premium — Solusi Digital Masa Depan">
    <meta name="author" content="TechNova Agency">
    <title>TechNova • Premium Digital Agency</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.7/dist/countUp.umd.min.js"></script>

    <style>
        :root {
            --hitam-mewah: #05050F;
            --gelap-utama: #0B0B1A;
            --gelap-kedua: #12122A;
            --gelap-ketiga: #1A1A3A;
            --biru-neon: #00D4FF;
            --ungu-neon: #8B5CF6;
            --cyan-neon: #22D3EE;
            --biru-terang: #60A5FA;
            --ungu-terang: #A78BFA;
            --putih-murni: #FFFFFF;
            --putih-lembut: #E2E8F0;
            --abu-lembut: #94A3B8;
            --abu-tua: #475569;
            --hijau-sukses: #10B981;
            --kuning-peringatan: #FBBF24;
            --merah-bahaya: #EF4444;
            --glow-biru: 0 0 20px rgba(0,212,255,0.5), 0 0 40px rgba(0,212,255,0.25);
            --glow-ungu: 0 0 20px rgba(139,92,246,0.5), 0 0 40px rgba(139,92,246,0.25);
            --glow-cyan: 0 0 20px rgba(34,211,238,0.5), 0 0 40px rgba(34,211,238,0.25);
            --glow-gabung: 0 0 25px rgba(0,212,255,0.4), 0 0 50px rgba(139,92,246,0.2);
            --sudut-bulat: 20px;
            --sudut-bulat-kecil: 12px;
            --transisi-cepat: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transisi-lambat: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            --batas-tipis: 1px solid rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--hitam-mewah);
            color: var(--putih-lembut);
            overflow-x: hidden;
            line-height: 1.7;
            font-weight: 400;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin-bottom: 0; }
        p { margin-bottom: 0; }
        a { text-decoration: none; color: inherit; transition: var(--transisi-cepat); }
        ul { list-style: none; padding-left: 0; margin-bottom: 0; }
        img { max-width: 100%; height: auto; display: block; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; transition: var(--transisi-cepat); }

        #layarMuat {
            position: fixed; inset: 0; background: var(--hitam-mewah);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #layarMuat.selesai { opacity: 0; visibility: hidden; }
        .wadahLogoMuat { position: relative; width: 140px; height: 140px; margin-bottom: 2rem; }
        .lingkaranLuar {
            position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent;
            border-top-color: var(--biru-neon); border-right-color: var(--ungu-neon);
            animation: putarMuat 1.5s linear infinite; box-shadow: var(--glow-gabung);
        }
        .lingkaranDalam {
            position: absolute; inset: 20px; border-radius: 50%; border: 2px solid transparent;
            border-bottom-color: var(--cyan-neon); border-left-color: var(--biru-terang);
            animation: putarMuat 1s linear infinite reverse;
        }
        .titikPusat {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
            box-shadow: var(--glow-gabung); animation: denyutMuat 2s ease infinite;
        }
        @keyframes putarMuat { to { transform: rotate(360deg); } }
        @keyframes denyutMuat { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 50% { transform: translate(-50%,-50%) scale(1.4); opacity: 0.7; } }
        .teksMuat { font-size: 1.8rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .barisMuat { width: 220px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 1.5rem; overflow: hidden; }
        .isiBarisMuat { height: 100%; width: 0; background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon)); animation: isikanBaris 2s ease forwards; }
        @keyframes isikanBaris { to { width: 100%; } }

        .wadahLatar { position: fixed; inset: 0; z-index: -5; overflow: hidden; }
        .gradienUtama {
            position: absolute; inset: -50%;
            background: radial-gradient(circle at 15% 25%, rgba(0,212,255,0.12) 0%, transparent 45%),
                        radial-gradient(circle at 85% 75%, rgba(139,92,246,0.12) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(34,211,238,0.06) 0%, transparent 55%);
            animation: gerakGradien 25s ease-in-out infinite alternate;
        }
        @keyframes gerakGradien {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            25% { transform: translate(3%,-2%) rotate(3deg) scale(1.05); }
            50% { transform: translate(-2%,3%) rotate(-2deg) scale(0.95); }
            100% { transform: translate(0,0) rotate(0deg) scale(1); }
        }
        .bentukBlob {
            position: absolute; border-radius: 999px; filter: blur(100px); opacity: 0.4;
            animation: gerakBlob 22s ease-in-out infinite alternate;
        }
        .blob1 { width: 600px; height: 600px; background: rgba(0,212,255,0.15); top: -200px; left: -150px; }
        .blob2 { width: 550px; height: 550px; background: rgba(139,92,246,0.15); bottom: -180px; right: -120px; animation-delay: -8s; }
        .blob3 { width: 450px; height: 450px; background: rgba(34,211,238,0.1); top: 40%; left: 55%; animation-delay: -15s; }
        @keyframes gerakBlob {
            0% { transform: translate(0,0) scale(1) rotate(0deg); }
            33% { transform: translate(50px,-40px) scale(1.1) rotate(8deg); }
            66% { transform: translate(-40px,30px) scale(0.9) rotate(-5deg); }
            100% { transform: translate(0,0) scale(1) rotate(0deg); }
        }
        .gridFuturistik {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
            background-size: 80px 80px; opacity: 0.3;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            animation: gerakGrid 30s linear infinite;
        }
        @keyframes gerakGrid { 0% { transform: translateY(0); } 100% { transform: translateY(80px); } }
        .teksturBising {
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.08; pointer-events: none;
        }
        .partikelLatar { position: absolute; border-radius: 50%; background: white; animation: melayangPartikel 12s ease-in-out infinite; }
        @keyframes melayangPartikel {
            0%,100% { opacity: 0.1; transform: translateY(0) translateX(0); }
            25% { opacity: 0.4; transform: translateY(-25px) translateX(10px); }
            50% { opacity: 0.2; transform: translateY(-10px) translateX(-8px); }
            75% { opacity: 0.3; transform: translateY(-30px) translateX(5px); }
        }
        .sorotKursor {
            position: fixed; width: 320px; height: 320px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 65%);
            pointer-events: none; z-index: 0; transform: translate(-50%, -50%); transition: opacity 0.3s ease;
        }
        @media (max-width: 768px) { .sorotKursor { display: none; } }
        .garisKemajuan {
            position: fixed; top: 0; left: 0; height: 3px; z-index: 9998;
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
            border-radius: 0 2px 2px 0; width: 0%; box-shadow: var(--glow-gabung);
        }

        .kacaTipis {
            background: rgba(18,18,42,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: var(--batas-tipis); border-radius: var(--sudut-bulat); transition: var(--transisi-cepat);
        }
        .kacaTipis:hover { border-color: rgba(0,212,255,0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .teksGradien {
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: alurGradien 6s linear infinite;
        }
        @keyframes alurGradien { to { background-position: 200% center; } }
        .batasGradien {
            position: relative; border-radius: var(--sudut-bulat); padding: 1px;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
        }
        .batasGradien > div { background: var(--gelap-utama); border-radius: calc(var(--sudut-bulat) - 1px); padding: 2rem; height: 100%; }
        .tombolUtama {
            position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.875rem 2rem; border-radius: 999px; font-weight: 600; font-size: 1rem;
            border: none; cursor: pointer; overflow: hidden; text-decoration: none;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
            color: var(--putih-murni); box-shadow: var(--glow-gabung); transition: var(--transisi-cepat);
        }
        .tombolUtama::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.25) 0%, transparent 60%);
            transform: scale(0) translate(10%,10%); transition: transform 0.5s ease; border-radius: inherit;
        }
        .tombolUtama:hover { transform: translateY(-3px); box-shadow: 0 0 35px rgba(0,212,255,0.5), 0 0 70px rgba(139,92,246,0.25); }
        .tombolUtama:hover::before { transform: scale(2.2) translate(0,0); }
        .tombolSekunder {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.875rem 2rem; border-radius: 999px; font-weight: 600; font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.15); background: transparent; color: var(--putih-lembut);
            cursor: pointer; text-decoration: none; transition: var(--transisi-cepat);
        }
        .tombolSekunder:hover { border-color: var(--biru-neon); color: var(--biru-neon); box-shadow: var(--glow-biru); transform: translateY(-3px); }
        .melayang { transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease; }
        .melayang:hover { transform: translateY(-8px) scale(1.02); }
        .efekAngkat { transition: transform 0.3s ease; }
        .efekAngkat:hover { transform: translateY(-5px); }
        .latarBayangan { position: relative; }
        .latarBayangan::after {
            content: ''; position: absolute; inset: -10px; border-radius: inherit;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon)); opacity: 0; z-index: -1;
            filter: blur(25px); transition: opacity 0.4s ease;
        }
        .latarBayangan:hover::after { opacity: 0.35; }

        .navUtama {
            position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1280px;
            z-index: 50; border-radius: 999px; padding: 0.875rem 2rem;
            background: rgba(10,10,25,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: var(--batas-tipis); transition: var(--transisi-cepat);
        }
        .navUtama:hover { border-color: rgba(0,212,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .tautanNav { position: relative; }
        .tautanNav::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon)); border-radius: 2px;
            transition: width 0.3s ease;
        }
        .tautanNav:hover::after { width: 100%; }
        .tombolPencarian { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: var(--batas-tipis); }
        .tombolPencarian:hover { border-color: var(--biru-neon); color: var(--biru-neon); box-shadow: var(--glow-biru); }
        .tombolSeluler { display: none; width: 40px; height: 40px; border-radius: 50%; align-items: center; justify-content: center; border: var(--batas-tipis); }
        @media (max-width: 991px) { .tombolSeluler { display: flex; } .navTautan { display: none; } }
        .menuSeluler {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 400px; height: 100vh;
            background: rgba(10,10,25,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-left: var(--batas-tipis); z-index: 55; padding: 2rem; transition: right 0.4s ease;
        }
        .menuSeluler.buka { right: 0; }
        .tutupMenu { position: absolute; top: 1.5rem; right: 1.5rem; width: 36px; height: 36px; border-radius: 50%; border: var(--batas-tipis); display: flex; align-items: center; justify-content: center; }
        .tutupMenu:hover { border-color: var(--merah-bahaya); color: var(--merah-bahaya); }
        .lapisanGelap {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 54; opacity: 0; visibility: hidden; transition: var(--transisi-cepat);
        }
        .lapisanGelap.aktif { opacity: 1; visibility: visible; }

        .bagianUtama { min-height: 100vh; display: flex; align-items: center; padding-top: 10rem; padding-bottom: 5rem; position: relative; overflow: hidden; }
        .elemenHiasan { position: absolute; opacity: 0.5; animation: melayangLambat 8s ease-in-out infinite alternate; }
        @keyframes melayangLambat {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-20px) rotate(3deg); }
        }
        .kotakIlustrasi { position: relative; height: 500px; perspective: 1000px; }
        .ilustrasi3d {
            position: absolute; inset: 0; border-radius: var(--sudut-bulat);
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(139,92,246,0.1));
            border: var(--batas-tipis); transform-style: preserve-3d;
            animation: putarLambat 15s ease-in-out infinite alternate;
        }
        @keyframes putarLambat {
            0% { transform: rotateX(5deg) rotateY(-10deg); }
            100% { transform: rotateX(-5deg) rotateY(10deg); }
        }
        .ikonTengah { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; background: var(--glow-gabung); color: var(--biru-neon); }

        .sliderKlien { padding: 2rem 0; border-top: var(--batas-tipis); border-bottom: var(--batas-tipis); }
        .swiperKlien .swiper-slide { display: flex; align-items: center; justify-content: center; height: 80px; opacity: 0.6; filter: grayscale(100%); transition: all 0.3s ease; }
        .swiperKlien .swiper-slide:hover { opacity: 1; filter: grayscale(0); transform: scale(1.1); }

        .kartuLayanan { height: 100%; padding: 2rem; border-radius: var(--sudut-bulat); border: var(--batas-tipis); background: rgba(10,10,25,0.4); transition: var(--transisi-cepat); position: relative; overflow: hidden; }
        .kartuLayanan::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent); transition: left 0.6s ease; }
        .kartuLayanan:hover::before { left: 100%; }
        .kartuLayanan:hover { border-color: var(--biru-neon); transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,212,255,0.15); }
        .wadahIkonLayanan { width: 60px; height: 60px; border-radius: var(--sudut-bulat-kecil); background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(139,92,246,0.15)); display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .wadahIkonLayanan i { font-size: 1.5rem; color: var(--biru-neon); }

        .langkahProses { position: relative; padding-left: 3rem; padding-bottom: 2.5rem; }
        .langkahProses::before { content: ''; position: absolute; left: 15px; top: 35px; width: 2px; height: calc(100% - 20px); background: linear-gradient(to bottom, var(--biru-neon), var(--ungu-neon), transparent); }
        .langkahProses:last-child::before { display: none; }
        .nomorLangkah {
            position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem;
            box-shadow: var(--glow-gabung);
        }

        .kartuPortofolio { border-radius: var(--sudut-bulat); overflow: hidden; border: var(--batas-tipis); background: rgba(10,10,25,0.4); transition: var(--transisi-cepat); position: relative; }
        .kartuPortofolio:hover { border-color: var(--ungu-neon); transform: translateY(-10px); box-shadow: 0 25px 50px rgba(139,92,246,0.15); }
        .gambarPortofolio { width: 100%; height: 240px; object-fit: cover; transition: transform 0.5s ease; background: linear-gradient(135deg, var(--gelap-kedua), var(--gelap-ketiga)); display: flex; align-items: center; justify-content: center; font-size: 4rem; color: var(--biru-neon); }
        .kartuPortofolio:hover .gambarPortofolio { transform: scale(1.08); }
        .isiPortofolio { padding: 1.5rem; }
        .labelKategori { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; background: rgba(0,212,255,0.1); color: var(--biru-neon); margin-bottom: 1rem; }
        .tombolLihat { position: absolute; top: 1.5rem; right: 1.5rem; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .kartuPortofolio:hover .tombolLihat { opacity: 1; transform: translateY(0); }

        .kartuHarga { height: 100%; padding: 2rem; border-radius: var(--sudut-bulat); border: var(--batas-tipis); background: rgba(10,10,25,0.4); transition: var(--transisi-cepat); position: relative; overflow: hidden; }
        .kartuHarga.unggulan { border-color: var(--biru-neon); background: rgba(0,212,255,0.05); box-shadow: var(--glow-gabung); }
        .labelUnggulan { position: absolute; top: 1.5rem; right: -2.5rem; padding: 0.5rem 3rem; background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon)); font-size: 0.75rem; font-weight: 600; transform: rotate(45deg); }
        .kartuHarga:hover { transform: translateY(-10px); }
        .daftarFitur { margin: 1.5rem 0; }
        .daftarFitur li { padding: 0.5rem 0; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }
        .daftarFitur li i { color: var(--hijau-sukses); }
        .daftarFitur li.tidak { color: var(--abu-tua); }
        .daftarFitur li.tidak i { color: var(--abu-tua); }

        .kartuTim { border-radius: var(--sudut-bulat); overflow: hidden; border: var(--batas-tipis); background: rgba(10,10,25,0.4); transition: var(--transisi-cepat); }
        .kartuTim:hover { transform: translateY(-8px); box-shadow: var(--glow-gabung); }
        .wadahFotoTim { position: relative; height: 280px; background: linear-gradient(135deg, var(--gelap-kedua), var(--gelap-ketiga)); display: flex; align-items: center; justify-content: center; font-size: 5rem; color: var(--ungu-neon); }
        .sosialTim { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.75rem; opacity: 0; transition: opacity 0.3s ease; }
        .kartuTim:hover .sosialTim { opacity: 1; }
        .tautanSosialTim { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: var(--transisi-cepat); }
        .tautanSosialTim:hover { background: var(--biru-neon); color: var(--putih-murni); }
        .isiTim { padding: 1.5rem; text-align: center; }

        .kotakStatistik { padding: 2rem; border-radius: var(--sudut-bulat); border: var(--batas-tipis); background: rgba(10,10,25,0.4); text-align: center; transition: var(--transisi-cepat); }
        .kotakStatistik:hover { border-color: var(--cyan-neon); transform: translateY(-5px); }
