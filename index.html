<head>

    <style>
        :root {
            --hitam-mewah: #02020A;
            --gelap-utama: #070714;
            --gelap-kedua: #0F0F24;
            --gelap-ketiga: #171738;
            --biru-neon: #00F0FF;
            --ungu-neon: #A855F7;
            --cyan-neon: #22D3EE;
            --biru-terang: #60A5FA;
            --ungu-terang: #C084FC;
            --putih-murni: #FFFFFF;
            --putih-lembut: #E2E8F0;
            --abu-lembut: #94A3B8;
            --abu-tua: #475569;
            --hijau-sukses: #10B981;
            --kuning-peringatan: #FBBF24;
            --merah-bahaya: #EF4444;
            --glow-biru: 0 0 25px rgba(0,240,255,0.5), 0 0 50px rgba(0,240,255,0.25);
            --glow-ungu: 0 0 25px rgba(168,85,247,0.5), 0 0 50px rgba(168,85,247,0.25);
            --glow-cyan: 0 0 25px rgba(34,211,238,0.5), 0 0 50px rgba(34,211,238,0.25);
            --glow-gabung: 0 0 30px rgba(0,240,255,0.4), 0 0 60px rgba(168,85,247,0.2);
            --sudut-bulat: 24px;
            --sudut-bulat-kecil: 16px;
            --transisi-cepat: all 0.3s cubic-bezier(0.16,1,0.3,1);
            --transisi-lambat: all 0.7s cubic-bezier(0.16,1,0.3,1);
            --batas-tipis: 1px solid rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--hitam-mewah);
            color: var(--putih-lembut);
            overflow-x: hidden;
            line-height: 1.7;
            font-weight: 400;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin-bottom: 0; }
        p { margin-bottom: 0; }
        a { text-decoration: none; color: inherit; transition: var(--transisi-cepat); }
        ul { list-style: none; padding-left: 0; margin-bottom: 0; }
        img { max-width: 100%; height: auto; display: block; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; transition: var(--transisi-cepat); }

        #layarMuat {
            position: fixed; inset: 0; background: var(--hitam-mewah);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1s ease, visibility 1s ease;
        }
        #layarMuat.selesai { opacity: 0; visibility: hidden; }

        .latarAuroraMuat {
            position: absolute; inset: -50%;
            background: radial-gradient(circle at 10% 10%, rgba(0,240,255,0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(168,85,247,0.15) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(34,211,238,0.08) 0%, transparent 50%);
            animation: auroraGerakMuat 15s ease-in-out infinite alternate;
        }
        @keyframes auroraGerakMuat {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            33% { transform: translate(5%,-3%) rotate(4deg) scale(1.1); }
            66% { transform: translate(-3%,5%) rotate(-3deg) scale(0.9); }
            100% { transform: translate(0,0) rotate(0deg) scale(1); }
        }

        .meshMuat {
            position: absolute; inset: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(0,240,255,0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(168,85,247,0.05) 0%, transparent 50%);
            animation: meshGerak 20s ease-in-out infinite alternate;
        }
        @keyframes meshGerak { 0% { transform: translateX(0) translateY(0); } 50% { transform: translateX(20px) translateY(-15px); } 100% { transform: translateX(0) translateY(0); } }

        .gridMuat {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(168,85,247,0.04) 1px, transparent 1px);
            background-size: 60px 60px; opacity: 0.2;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            animation: gridScan 25s linear infinite;
        }
        @keyframes gridScan { 0% { transform: translateY(0); } 100% { transform: translateY(60px); } }

        .teksturBisingMuat {
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.06; pointer-events: none;
        }

        .wadahPartikelMuat { position: absolute; inset: 0; overflow: hidden; }
        .partikelNeonMuat {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, var(--biru-neon), transparent 70%);
            box-shadow: 0 0 10px var(--biru-neon);
            animation: partikelMelayangMuat 12s ease-in-out infinite;
        }
        @keyframes partikelMelayangMuat {
            0%,100% { transform: translateY(0) translateX(0); opacity: 0.15; }
            25% { transform: translateY(-50px) translateX(20px); opacity: 0.5; }
            50% { transform: translateY(-25px) translateX(-15px); opacity: 0.25; }
            75% { transform: translateY(-60px) translateX(10px); opacity: 0.4; }
        }

        .sorotKursorMuat {
            position: absolute; width: 250px; height: 250px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.06) 0%, transparent 65%);
            pointer-events: none; transform: translate(-50%, -50%); transition: opacity 0.3s ease;
        }

        .wadahLogoMuat { position: relative; width: 180px; height: 180px; margin-bottom: 3rem; perspective: 1000px; }
        .lapisanLingkaran { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
        .lingkaran1 { border-top-color: var(--biru-neon); border-right-color: var(--ungu-neon); animation: putarCepat 2s linear infinite; box-shadow: 0 0 20px var(--biru-neon); }
        .lingkaran2 { inset: 15px; border-bottom-color: var(--cyan-neon); border-left-color: var(--ungu-terang); animation: putarLambat 3s linear infinite reverse; opacity: 0.8; }
        .lingkaran3 { inset: 30px; border-top-color: var(--biru-terang); border-right-color: var(--cyan-neon); animation: putarSedang 2.5s linear infinite; opacity: 0.6; }
        .lingkaran4 { inset: 45px; border-bottom-color: var(--ungu-neon); border-left-color: var(--biru-neon); animation: putarCepat 1.8s linear infinite reverse; opacity: 0.4; }
        @keyframes putarCepat { to { transform: rotate(360deg); } }
        @keyframes putarLambat { to { transform: rotate(-360deg); } }
        @keyframes putarSedang { to { transform: rotate(360deg); } }

        .intiLogo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
            box-shadow: 0 0 30px var(--biru-neon), 0 0 60px var(--ungu-neon);
            animation: denyutInti 2s ease-in-out infinite;
        }
        @keyframes denyutInti {
            0%,100% { transform: translate(-50%,-50%) scale(1); }
            50% { transform: translate(-50%,-50%) scale(1.3); }
        }

        .lensaSinar {
            position: absolute; top: 50%; left: 50%; width: 300px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--biru-neon), transparent);
            transform-origin: center; animation: sinarLensa 4s linear infinite; opacity: 0.4;
        }
        @keyframes sinarLensa { to { transform: rotate(360deg); } }

        .garisPindai {
            position: absolute; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--biru-neon), transparent);
            animation: pindaiGaris 3s ease-in-out infinite;
        }
        @keyframes pindaiGaris { 0% { top: 0; opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        .wadahProgres { width: 320px; margin-bottom: 1rem; }
        .barisProgres { height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
        .isiProgres { height: 100%; width: 0%; background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon)); border-radius: inherit; box-shadow: var(--glow-gabung); position: relative; }
        .isiProgres::after {
            content: ''; position: absolute; top: 0; right: 0; width: 30px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: kilauProgres 1.5s linear infinite;
        }
        @keyframes kilauProgres { to { transform: translateX(100%); } }

        .teksProgres { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
        .persenMuat { font-size: 2.2rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .statusMuat { font-size: 0.95rem; color: var(--abu-lembut); text-transform: uppercase; letter-spacing: 1px; }

        .ikonSukses { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); font-size: 5rem; color: var(--hijau-sukses); opacity: 0; transition: all 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
        .selesaiMuat .ikonSukses { transform: translate(-50%,-50%) scale(1); opacity: 1; }
        .selesaiMuat .wadahLogoMuat > :not(.ikonSukses) { opacity: 0; transform: scale(0.7) rotateY(180deg); transition: all 0.5s ease; }

        .garisKemajuan {
            position: fixed; top: 0; left: 0; height: 3px; z-index: 9998;
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
            border-radius: 0 2px 2px 0; width: 0%; box-shadow: var(--glow-gabung);
        }

        .latarUtama { position: fixed; inset: 0; z-index: -5; overflow: hidden; }
        .kanvasTigaD { position: absolute; inset: 0; width: 100%; height: 100%; }
        .latarGradien {
            position: absolute; inset: -50%;
            background: radial-gradient(circle at 15% 25%, rgba(0,240,255,0.1) 0%, transparent 45%),
                        radial-gradient(circle at 85% 75%, rgba(168,85,247,0.1) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(34,211,238,0.05) 0%, transparent 55%);
            animation: gerakGradienUtama 30s ease-in-out infinite alternate;
        }
        @keyframes gerakGradienUtama {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            25% { transform: translate(4%,-3%) rotate(3deg) scale(1.05); }
            50% { transform: translate(-3%,4%) rotate(-2deg) scale(0.95); }
            100% { transform: translate(0,0) rotate(0deg) scale(1); }
        }
        .bentukBlobUtama {
            position: absolute; border-radius: 999px; filter: blur(120px); opacity: 0.35;
            animation: gerakBlobUtama 25s ease-in-out infinite alternate;
        }
        .blobUtama1 { width: 700px; height: 700px; background: rgba(0,240,255,0.12); top: -250px; left: -200px; }
        .blobUtama2 { width: 600px; height: 600px; background: rgba(168,85,247,0.12); bottom: -200px; right: -150px; animation-delay: -10s; }
        .blobUtama3 { width: 500px; height: 500px; background: rgba(34,211,238,0.08); top: 30%; left: 60%; animation-delay: -18s; }
        @keyframes gerakBlobUtama {
            0% { transform: translate(0,0) scale(1) rotate(0deg); }
            33% { transform: translate(60px,-50px) scale(1.15) rotate(10deg); }
            66% { transform: translate(-50px,40px) scale(0.85) rotate(-8deg); }
            100% { transform: translate(0,0) scale(1) rotate(0deg); }
        }
        .gridUtama {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
            background-size: 100px 100px; opacity: 0.2;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            animation: gerakGridUtama 35s linear infinite;
        }
        @keyframes gerakGridUtama { 0% { transform: translateY(0); } 100% { transform: translateY(100px); } }
        .sorotKursorUtama {
            position: fixed; width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.05) 0%, transparent 70%);
            pointer-events: none; z-index: 0; transform: translate(-50%, -50%); transition: opacity 0.3s ease;
        }
        @media (max-width: 768px) { .sorotKursorUtama { display: none; } }

        .kacaPremium {
            background: rgba(15,15,35,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: var(--batas-tipis); border-radius: var(--sudut-bulat); transition: var(--transisi-cepat);
        }
        .kacaPremium:hover { border-color: rgba(0,240,255,0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
        .teksGradienUtama {
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: alurGradienTeks 7s linear infinite;
        }
        @keyframes alurGradienTeks { to { background-position: 200% center; } }
        .batasGradienUtama {
            position: relative; border-radius: var(--sudut-bulat); padding: 1px;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
        }
        .batasGradienUtama > div { background: var(--gelap-utama); border-radius: calc(var(--sudut-bulat) - 1px); padding: 2.5rem; height: 100%; }
        .tombolUtamaPremium {
            position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem;
            padding: 1rem 2.25rem; border-radius: 999px; font-weight: 600; font-size: 1.05rem;
            border: none; cursor: pointer; overflow: hidden; text-decoration: none;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon));
            color: var(--putih-murni); box-shadow: var(--glow-gabung); transition: var(--transisi-cepat);
        }
        .tombolUtamaPremium::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 60%);
            transform: scale(0) translate(15%,15%); transition: transform 0.6s ease; border-radius: inherit;
        }
        .tombolUtamaPremium::after {
            content: ''; position: absolute; inset: -2px; border-radius: inherit;
            background: linear-gradient(135deg, var(--biru-neon), var(--ungu-neon), var(--cyan-neon));
            opacity: 0; z-index: -1; filter: blur(15px); transition: opacity 0.4s ease;
        }
        .tombolUtamaPremium:hover { transform: translateY(-4px) scale(1.02); }
        .tombolUtamaPremium:hover::before { transform: scale(2.5) translate(0,0); }
        .tombolUtamaPremium:hover::after { opacity: 0.5; }
        .tombolSekunderPremium {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem;
            padding: 1rem 2.25rem; border-radius: 999px; font-weight: 600; font-size: 1.05rem;
            border: 2px solid rgba(255,255,255,0.15); background: transparent; color: var(--putih-lembut);
            cursor: pointer; text-decoration: none; transition: var(--transisi-cepat);
        }
        .tombolSekunderPremium:hover { border-color: var(--biru-neon); color: var(--biru-neon); box-shadow: var(--glow-biru); transform: translateY(-4px); }
        .efekRiak { position: relative; overflow: hidden; }
        .riak {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); transform: scale(0);
            animation: sebarkanRiak 0.7s ease-out; pointer-events: none;
        }
        @keyframes sebarkanRiak { to { transform: scale(4); opacity: 0; } }
        .tombolMagnetis { transition: transform 0.2s ease-out; }
        .melayangKartu { transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), box-shadow 0.5s ease; }
        .melayangKartu:hover { transform: translateY(-10px) scale(1.01); box-shadow: 0 25px 55px rgba(0,0,0,0.3); }

        .navPremium {
            position: fixed; top: 1.75rem; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1400px;
            z-index: 50; border-radius: 999px; padding: 1rem 2.5rem;
            background: rgba(8,8,20,0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: var(--batas-tipis); transition: var(--transisi-cepat);
        }
        .navPremium:hover { border-color: rgba(0,240,255,0.25); box-shadow: 0 15px 50px rgba(0,0,0,0.25); }
        .tautanNavPremium { position: relative; font-weight: 500; }
        .tautanNavPremium::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            width: 0; height: 3px; border-radius: 999px;
            background: linear-gradient(90deg, var(--biru-neon), var(--ungu-neon));
            transition: width 0.4s ease;
        }
        .tautanNavPremium:hover::after { width: 100%; }
        .tombolPencarianNav { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: var(--batas-tipis); }
        .tombolPencarianNav:hover { border-color: var(--biru-neon); color: var(--biru-neon); box-shadow: var(--glow-biru); }
        .tombolSelulerNav { display: none; width: 44px; height: 44px; border-radius: 50%; align-items: center; justify-content: center; border: var(--batas-tipis); }
        @media (max-width: 991px) { .tombolSelulerNav { display: flex; } .daftarTautanNav { display: none; } }
        .menuSelulerPremium {
            position: fixed; top: 0; right: -100%; width: 88%; max-width: 420px; height: 100vh;
            background: rgba(8,8,20,0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-left: var(--batas-tipis); z-index: 55; padding: 2.5rem; transition: right 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        .menuSelulerPremium.buka { right: 0; }
        .tutupMenuSeluler { position: absolute; top: 2rem; right: 2rem; width: 40px; height: 40px; border-radius: 50%; border: var(--batas-tipis); display: flex; align-items: center; justify-content: center; }
        .tutupMenuSeluler:hover { border-color: var(--merah-bahaya); color: var(--merah-bahaya); }
        .lapisanGelapMenu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 54; opacity: 0; visibility: hidden; transition: var(--transisi-cepat);
        }
        .lapisanGelapMenu.aktif { opacity: 1; visibility: visible; }

        .bagianHeroPremium { min-height: 100vh; display: flex; align-items: center; padding-top: 12rem; padding-bottom: 6rem; position: relative; overflow: hidden; }
        .elemenHiasanHero { position: absolute; opacity: 0.4; animation: melayangLambatHero 10s ease-in-out infinite alternate; }
        @keyframes melayangLambatHero {
            0% { transform: translateY(0) rotate(-4deg); }
            100% { transform: translateY(-25px) rotate(4deg); }
        }
        .kotakIlustrasiHero { position: relative; height: 550px; perspective: 1200px; }
        .ilustrasi3dHero {
            position: absolute; inset: 0; border-radius: var(--sudut-bulat);
            background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(168,85,247,0.1));
            border: var(--batas-tipis); transform-style: preserve-3d;
            animation: putarLambatHero 18s ease-in-out infinite alternate;
        }
        @keyframes putarLambatHero {
            0% { transform: rotateX(8deg) rotateY(-12deg); }
            100% { transform: rotateX(-8deg) rotateY(12deg); }
        }
        .ikonTengahHero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; background: var(--glow-gabung); color: var(--biru-neon); }

        .sliderKlienPremium { padding: 2.5rem 0; border-top: var(--batas-tipis); border-bottom: var(--batas-tipis); }
